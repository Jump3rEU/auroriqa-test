<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#0a0a0f"/>
  
  <defs>
    <!-- Aurora gradients -->
    <radialGradient id="aurora1" cx="30%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.1"/>
    </radialGradient>
    
    <radialGradient id="aurora2" cx="70%" cy="60%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.1"/>
    </radialGradient>
    
    <!-- Text gradient -->
    <linearGradient id="text-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="33%" stop-color="#06b6d4"/>
      <stop offset="66%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    
    <!-- Glow effect -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="12" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Aurora background effects -->
  <ellipse cx="350" cy="250" rx="400" ry="300" fill="url(#aurora1)" filter="url(#glow)"/>
  <ellipse cx="850" cy="380" rx="450" ry="320" fill="url(#aurora2)" filter="url(#glow)"/>
  
  <!-- Brand name -->
  <text x="600" y="280" font-family="Space Grotesk, sans-serif" font-size="120" font-weight="700" fill="url(#text-gradient)" text-anchor="middle" filter="url(#glow)">
    Auroriqa
  </text>
  
  <!-- Tagline -->
  <text x="600" y="360" font-family="Inter, sans-serif" font-size="36" font-weight="400" fill="#ffffff" fill-opacity="0.8" text-anchor="middle">
    Prémiová tvorba webů &amp; digitální řešení
  </text>
  
  <!-- Decorative elements -->
  <circle cx="200" cy="150" r="8" fill="#10b981" opacity="0.8">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1000" cy="480" r="12" fill="#06b6d4" opacity="0.7">
    <animate attributeName="opacity" values="0.3;0.9;0.3" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="150" cy="500" r="6" fill="#8b5cf6" opacity="0.6">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1050" cy="120" r="10" fill="#3b82f6" opacity="0.75">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="2.8s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Bottom gradient bar -->
  <rect x="0" y="580" width="1200" height="50" fill="url(#text-gradient)" opacity="0.2"/>
</svg>
