<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="512" height="512" rx="128" fill="url(#bg-gradient)"/>
  
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bg-gradient" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="50%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0a0a0f"/>
    </linearGradient>
    
    <!-- Aurora glow gradient -->
    <radialGradient id="aurora-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2"/>
    </radialGradient>
    
    <!-- Letter A gradient -->
    <linearGradient id="letter-gradient" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="33%" stop-color="#06b6d4"/>
      <stop offset="66%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    
    <!-- Glow filter -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Aurora background circles -->
  <circle cx="150" cy="150" r="180" fill="url(#aurora-glow)" opacity="0.3" filter="url(#glow)"/>
  <circle cx="380" cy="380" r="200" fill="url(#aurora-glow)" opacity="0.25" filter="url(#glow)"/>
  
  <!-- Stylized letter "A" -->
  <g filter="url(#glow)">
    <!-- Left stroke of A -->
    <path d="M 180 400 L 256 150 L 280 150 L 210 400 Z" fill="url(#letter-gradient)"/>
    
    <!-- Right stroke of A -->
    <path d="M 280 150 L 332 400 L 302 400 L 256 150 Z" fill="url(#letter-gradient)"/>
    
    <!-- Middle bar of A with gap -->
    <path d="M 220 280 L 292 280 L 286 310 L 226 310 Z" fill="url(#letter-gradient)"/>
    
    <!-- Top accent dot (representing aurora) -->
    <circle cx="256" cy="120" r="16" fill="#10b981" opacity="0.9">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Subtle shine effect -->
  <path d="M 128 0 Q 256 128, 384 0" stroke="url(#letter-gradient)" stroke-width="2" fill="none" opacity="0.3"/>
</svg>
